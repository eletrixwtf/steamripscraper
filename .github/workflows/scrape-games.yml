name: Scrape Steamrip Games

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

# THIS FIXES THE 403 PERMISSION DENIED ERROR
permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          pip install requests playwright
          playwright install chromium
          
      - name: Run scraper
        run: python scrape_games.py
        
      - name: Commit and push results
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions Bot"
          git add games_list.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update games_list.json [skip ci]" && git push)
